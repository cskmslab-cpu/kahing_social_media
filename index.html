<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>慶的個人網站</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Helvetica Neue", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: #f0f2f5;
    color: #1c1e21;
  }

  /* 整體容器 */
  .container { max-width: 1000px; margin: 0 auto; }

  /* 橫幅 */
  .cover {
    position: relative;
    height: 350px;
    background: linear-gradient(135deg, #4267B2, #5b7bd5, #89a7e0);
    border-radius: 0 0 12px 12px;
    overflow: hidden;
  }
  .cover-text {
    position: absolute;
    bottom: 20px;
    right: 30px;
    color: rgba(255,255,255,0.85);
    font-size: 14px;
  }

  /* 頭像與姓名區 */
  .profile-header {
    background: #fff;
    border-radius: 0 0 12px 12px;
    padding: 0 30px 20px;
    display: flex;
    align-items: flex-end;
    gap: 20px;
    margin-top: -90px;
    position: relative;
    flex-wrap: wrap;
  }
  .avatar {
    width: 168px;
    height: 168px;
    border-radius: 50%;
    border: 5px solid #fff;
    background: linear-gradient(135deg, #ff9a9e, #fecfef);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 60px;
    color: #fff;
    flex-shrink: 0;
  }
  .name-block { padding-bottom: 15px; }
  .name-block h1 { font-size: 32px; }
  .name-block p { color: #65676b; margin-top: 4px; }

  /* 主體：左右兩欄 */
  .main {
    display: flex;
    gap: 16px;
    margin-top: 16px;
    padding: 0 16px;
    align-items: flex-start;
  }
  .left { flex: 0 0 360px; }
  .right { flex: 1; }

  /* 卡片通用樣式 */
  .card {
    background: #fff;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 16px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.1);
  }
  .card h2 { font-size: 20px; margin-bottom: 12px; }

  /* 簡介列表 */
  .info-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 0;
    color: #65676b;
  }
  .info-item .icon { font-size: 20px; }

  /* 貼文 */
  .post-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }
  .post-avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff9a9e, #fecfef);
  }
  .post-header strong { display: block; }
  .post-header span { font-size: 13px; color: #65676b; }
  .post-body { line-height: 1.6; margin-bottom: 12px; }
  .post-image {
    width: 100%;
    height: 250px;
    background: linear-gradient(135deg, #a8edea, #fed6e3);
    border-radius: 8px;
  }
  .post-actions {
    display: flex;
    border-top: 1px solid #e4e6eb;
    margin-top: 12px;
    padding-top: 8px;
  }
  .post-actions button {
    flex: 1;
    padding: 8px;
    background: none;
    border: none;
    color: #65676b;
    font-size: 15px;
    cursor: pointer;
    border-radius: 6px;
  }
  .post-actions button:hover { background: #f0f2f5; }

  /* 響應式：手機上變成單欄 */
  @media (max-width: 768px) {
    .cover { height: 200px; border-radius: 0; }
    .profile-header {
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-top: -80px;
    }
    .name-block { padding-bottom: 0; }
    .main { flex-direction: column; }
    .left { flex: 1 1 auto; width: 100%; }
  }
</style>
</head>
<body>

  <div class="container">

    <!-- 橫幅 -->
    <div class="cover">
      <img src="https://i.ibb.co/r27YRtZ0/16bit.png" 
       style="width:100%; height:100%; object-fit:cover;">
    </div>

    <!-- 頭像與姓名 -->
    <div class="profile-header">
      <div class="avatar" style="overflow:hidden; padding:0;">
  <img src="https://i.ibb.co/tMpthF8H/gpt-image-2-medium-a.png" 
       style="width:100%; height:100%; object-fit:cover;">
</div>
      <div class="name-block">
        <h1>慶豐年</h1>
        <p>就是愛玩</p>
      </div>
    </div>

    <!-- 主體兩欄 -->
    <div class="main">

      <!-- 左欄：簡介 -->
      <div class="left">
        <div class="card">
          <h2>簡介</h2>
          <div class="info-item">
            <span class="icon">💼</span>
            <span>職業 / 公司</span>
          </div>
          <div class="info-item">
            <span class="icon">🎓</span>
            <span>畢業學校</span>
          </div>
          <div class="info-item">
            <span class="icon">📍</span>
            <span>居住城市</span>
          </div>
          <div class="info-item">
            <span class="icon">✉️</span>
            <span>your@email.com</span>
          </div>
        </div>

        <div class="card">
          <h2>相片</h2>
          <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:6px;">
            <a href="https://ibb.co/album/M95nVN" target="_blank">
      <img src="https://i.ibb.co/dnkN4Bv/IMG-5666-copy.jpg" style="width:100%; aspect-ratio:1; border-radius:8px; object-fit:cover; display:block;">
    </a>

            <a href="https://ibb.co/album/phY6cr" target="_blank">
      <img src="https://i.ibb.co/cc9ZH6Q5/IMG-5363.jpg" style="width:100%; aspect-ratio:1; border-radius:8px; object-fit:cover; display:block;">
    </a>
            <div style="aspect-ratio:1; border-radius:8px; background:linear-gradient(135deg,#fdcbf1,#e6dee9);"></div>
            <div style="aspect-ratio:1; border-radius:8px; background:linear-gradient(135deg,#ffecd2,#fcb69f);"></div>
            <div style="aspect-ratio:1; border-radius:8px; background:linear-gradient(135deg,#a1c4fd,#c2e9fb);"></div>
            <div style="aspect-ratio:1; border-radius:8px; background:linear-gradient(135deg,#d4fc79,#96e6a1);"></div>
          </div>
        </div>
      </div>

      <!-- 右欄：動態貼文 -->
      <div class="right">
        <div class="card">
          <div class="post-header">
            <div class="post-avatar"></div>
            <div>
              <strong>你的名字</strong>
              <span>2 小時前</span>
            </div>
          </div>
          <div class="post-body">這是我的第一則貼文！歡迎來到我的個人網站 🎉</div>
          <div class="post-image"></div>
          <div class="post-actions">
            <button>👍 讚</button>
            <button>💬 留言</button>
            <button>↪️ 分享</button>
          </div>
        </div>

        <div class="card">
          <div class="post-header">
            <div class="post-avatar"></div>
            <div>
              <strong>你的名字</strong>
              <span>昨天</span>
            </div>
          </div>
          <div class="post-body">在這裡分享一些日常想法與生活點滴。你可以複製這整個卡片區塊來新增更多貼文。</div>
          <div class="post-actions">
            <button>👍 讚</button>
            <button>💬 留言</button>
            <button>↪️ 分享</button>
          </div>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
