<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的 Facebook 動態牆</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { color: #1877f2; text-align: center; }
        .post-card { background: white; border-radius: 8px; padding: 15px; margin-bottom: 15px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .post-time { color: #65676b; font-size: 12px; margin-top: 5px; }
        .loading { text-align: center; color: #65676b; }
    </style>
</head>
<body>

    <div class="container">
        <h1>我的 Facebook 動態牆測試</h1>
        <div id="posts-container" class="loading">正在直接連線至 Supabase 讀取貼文...</div>
    </div>

    <script>
        // 【請在此處填入你的真實資料】
        const SUPABASE_URL = "https://jguoddbmklnbrabkasgc.supabase.co"; 
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpndW9kZGJta2xuYnJhYmthc2djIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0NzA4ODcsImV4cCI6MjA5NjA0Njg4N30.OXtsYTO7Kppsu1hmUG-CyOSCB6K3YojeUoT4gtU70N0";

        // 採用瀏覽器內建的原生 Fetch API，完全不依賴外部套件
        async function fetchPostsDirectly() {
            const container = document.getElementById('posts-container');
            
            // 格式化網址，確保路徑正確指向你的 posts 資料表
            const apiUrl = `${SUPABASE_URL}/rest/v1/posts?select=*&order=created_at.desc`;

            try {
                const response = await fetch(apiUrl, {
                    method: 'GET',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP 錯誤！狀態碼: ${response.status}`);
                }

                const data = await response.json();

                if (!data || data.length === 0) {
                    container.innerText = '目前資料庫沒有任何貼文，請至 Supabase 後台新增。';
                    return;
                }

                // 清空載入中狀態，渲染卡片
                container.classList.remove('loading');
                container.innerHTML = data.map(post => `
                    <div class="post-card">
                        <p style="margin: 0; font-size: 16px;">${post.content}</p>
                        <div class="post-time">發文時間: ${new Date(post.created_at).toLocaleString()}</div>
                    </div>
                `).join('');

            } catch (error) {
                container.innerHTML = `<span style="color:red;">連線失敗: ${error.message}</span>`;
                console.error(error);
            }
        }

        // 執行抓取
        fetchPostsDirectly();
    </script>
</body>
</html>
